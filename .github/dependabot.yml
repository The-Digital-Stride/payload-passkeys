version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Mirrors pnpm's minimumReleaseAge (pnpm-workspace.yaml).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # The dev copies of Payload stay on the lowest supported version (peerDependencies: >=3.90.0),
    # so local tests run against the oldest Payload a host may have. CI's matrix swaps in every
    # newer minor. Raising the baseline means raising the supported range: a deliberate change,
    # made by hand, not a Dependabot bump.
    # Major versions are upgraded by hand, one at a time: they break tooling together (TypeScript
    # 7 before typescript-eslint supports it), move past what Payload 3 accepts (graphql 17), or
    # describe a newer Node than engines.node (@types/node must stay on 22).
    ignore:
      - dependency-name: 'payload'
      - dependency-name: '@payloadcms/*'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      simplewebauthn:
        # Read both changelogs before merging: these are exact pins on purpose (review L9).
        patterns: ['@simplewebauthn/*']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['payload', '@payloadcms/*', '@simplewebauthn/*']
  # Keeps the SHA pins and updates the version comment beside each. `/` covers only
  # .github/workflows, so the composite action is listed too.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
